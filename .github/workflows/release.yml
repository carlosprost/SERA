name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for x86_64 Mac and silicon
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # for x86_64 Linux
            args: ""
          - platform: "windows-latest" # for x86_64 Windows
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets for macos cross-compilation
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - name: install frontend dependencies
        run: npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Usamos la referencia del tag que disparó la acción
          tagName: ${{ github.ref_name }}
          releaseName: "SERA ${{ github.ref_name }}"
          releaseBody: "Lanzamiento oficial de SERA v3.0.0. Incluye Ribbon UI, Reportes PDF y Cifrado .srx."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # SI REALMENTE NECESITÁS ARM LINUX (Deb), se recomienda compilarlo aparte
  # ya que requiere runners especiales o una configuración de cross-build manual.
