<h2 mat-dialog-title class="dialog-header">
  <mat-icon>lock</mat-icon> {{ data.title || 'Seguridad' }}
</h2>

<mat-dialog-content class="dialog-content">
  <p class="subtitle">{{ data.message }}</p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Contraseña</mat-label>
    <input matInput [type]="hide ? 'password' : 'text'" [(ngModel)]="password" (keyup.enter)="onConfirm()">
    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
      <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
    @if (!data.required) {
      <mat-hint>Si se deja en blanco, se usará la seguridad interna por defecto.</mat-hint>
    }
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="accent" (click)="onConfirm()" [disabled]="data.required && !password">
    Confirmar
  </button>
</mat-dialog-actions>
