<div class="search-results-page">
  <header class="results-header">
    <div class="header-content">
      <mat-icon class="search-icon">search</mat-icon>
      <div class="title-area">
        <h1>Resultados para: "{{ term }}"</h1>
        <p>Se encontraron coincidencias en {{ tableNames.length }} tablas.</p>
      </div>
    </div>
  </header>

  <div class="results-grid">
    <mat-card *ngFor="let tableName of tableNames" class="table-result-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>table_chart</mat-icon>
        <mat-card-title>{{ tableName }}</mat-card-title>
        <mat-card-subtitle>{{ results[tableName].length }} coincidencias</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="table-container">
          <table class="simple-table">
            <thead>
              <tr>
                <th *ngFor="let key of getKeys(results[tableName][0])">{{ key }}</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of results[tableName]">
                <td *ngFor="let key of getKeys(row)">{{ row[key] }}</td>
                <td>
                  <button mat-icon-button color="primary" (click)="goToRow(tableName, row)" matTooltip="Ver en tabla">
                    <mat-icon>open_in_new</mat-icon>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
