<div class="table-dashboard-panel" *ngIf="showCharts()">
  <div class="dashboard-header">
    <div class="header-info">
      <mat-icon>insights</mat-icon>
      <h3>Análisis de Datos</h3>
    </div>
    
    <div class="field-selector">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Analizar por campo...</mat-label>
        <mat-select [(value)]="selectedField" (selectionChange)="updateAnalysis()">
          <mat-option *ngFor="let col of availableFields()" [value]="col.Field">
            {{ col.Field }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="charts-container">
    
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Distribución de Categorías</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <canvas baseChart
                [data]="pieChartData"
                [options]="pieChartOptions"
                [type]="pieChartType">
        </canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Frecuencia de Valores</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <canvas baseChart
                [data]="barChartData"
                [options]="barChartOptions"
                [type]="barChartType">
        </canvas>
      </mat-card-content>
    </mat-card>

  </div>
</div>
